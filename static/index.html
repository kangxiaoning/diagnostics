<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diagnostics</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Left: Chat -->
      <section class="chat" id="chatPanel">
        <header class="chat-header">
          <div class="chat-header-left">
            <span class="logo">◈</span>
            <div>
              <h1>Diagnostics</h1>
              <p id="statusLabel" class="status-text">就绪</p>
            </div>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="chatForm" class="composer">
          <textarea id="promptInput" rows="8" autocomplete="off"
            placeholder="输入诊断问题，例如：
【诊断对象】ACK 集群 prod-cluster / namespace default / deployment java-backend
【故障时段】2026-06-06 14:30 起
【运行负载】Spring Boot 应用，单 Pod memory limit=512Mi

deployment java-backend 从下午 2 点半开始频繁重启，每小时重启 10+ 次，
describe 显示 OOMKilled，但设置的 memory limit 是 512Mi，
不确定是代码内存泄漏还是 limit 设太小。"
            required></textarea>
          <div class="composer-actions">
            <span class="composer-hint">⌘↵ 发送 · 描述你观察到的症状，Agent 将逐步采集数据并给出诊断</span>
            <button id="actionBtn" type="submit" title="发送 (⌘↵)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
              </svg>
              <span>发送</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Resizer -->
      <div class="resizer" id="resizer"></div>

      <!-- Right: Graph -->
      <aside class="graph">
        <header class="graph-header">
          <h2>执行过程</h2>
          <span id="graphStatus" class="graph-status idle">等待任务</span>
        </header>
        <div id="graphCanvas" class="graph-canvas">
          <svg id="graphEdges" class="graph-edges"></svg>
          <div id="graphNodes" class="graph-nodes"></div>
          <div id="graphEmpty" class="graph-empty">
            <div class="graph-empty-icon">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="24" cy="18" r="3"/><path d="M24 25v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="24" y1="33" x2="24" y2="33" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
            </div>
            <p>发送诊断请求后<br>Agent 执行流程将在此动态展示</p>
          </div>
        </div>
        <div id="toolPopup" class="tool-popup hidden">
          <div class="tool-popup-header">
            <span id="toolPopupTitle"></span>
            <button id="toolPopupClose" class="popup-close">&times;</button>
          </div>
          <div class="tool-popup-body" id="toolPopupBody"></div>
        </div>
      </aside>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
