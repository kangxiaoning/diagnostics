<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <title>Diagnostics</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Left: Chat -->
      <section class="chat" id="chatPanel">
        <header class="chat-header">
          <div class="chat-header-left">
            <span class="logo">◈</span>
            <div>
              <h1>Diagnostics</h1>
              <p id="statusLabel" class="status-text">就绪</p>
            </div>
          </div>
        </header>

        <!-- History reports list (top-left, always visible) -->
        <div class="history-bar" id="historyBar">
          <div class="history-bar-header">
            <h3>历史报告</h3>
          </div>
          <div class="history-bar-list" id="historyBarList">
            <div class="history-item-placeholder">加载中...</div>
          </div>
        </div>

        <!-- Param Overrides Bar — per-session diagnostic context -->
        <div class="param-bar" id="paramBar">
          <div class="param-bar-header">
            <span class="param-bar-label">选择诊断对象类型</span>
            <select id="taskType" class="param-select">
              <option value="">-- 请选择 --</option>
              <option value="host">🖥 主机诊断</option>
              <option value="container">📦 容器诊断</option>
            </select>
          </div>
          <div class="param-fields hidden" id="paramFieldsContainer">
            <div class="param-row">
              <input id="paramClusterName" class="param-input" type="text" placeholder="集群名称 (cluster_name)" />
            </div>
            <div class="param-row">
              <input id="paramNamespace" class="param-input" type="text" placeholder="命名空间 (namespace)" />
            </div>
            <div class="param-row">
              <input id="paramPodName" class="param-input" type="text" placeholder="Pod 名称 (pod_name)" />
            </div>
          </div>
          <div class="param-fields hidden" id="paramFieldsHost">
            <div class="param-row">
              <input id="paramNameChunk" class="param-input" type="text" placeholder="主机标识 (name_chunk)" />
            </div>
          </div>
          <div class="param-fields hidden" id="paramFieldsCommon">
            <div class="param-row">
              <input id="paramStartTime" class="param-input param-time" type="datetime-local" />
              <input id="paramEndTime" class="param-input param-time" type="datetime-local" />
            </div>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <form id="chatForm" class="composer">
          <div class="skills-bar" id="skillsBar"></div>
          <div class="composer-wrapper">
            <textarea id="promptInput" rows="3" autocomplete="off"
              placeholder="输入故障现象，按 / 选择诊断技能
例如：prod-us-east 集群 worker-5/8 NotReady，Pod 被驱逐，dmesg 显示 conntrack table full"
              required></textarea>
            <div class="skill-suggestions" id="skillSuggestions"></div>
          </div>
          <div class="composer-actions">
            <span class="composer-hint">⌘↵ 发送 · 描述你观察到的症状，Agent 将逐步采集数据并给出诊断</span>
            <button id="actionBtn" type="submit" title="发送 (⌘↵)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
              </svg>
              <span>发送</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Resizer -->
      <div class="resizer" id="resizer"></div>

      <!-- Right: Graph -->
      <aside class="graph">
        <header class="graph-header">
          <div class="graph-tabs">
            <button id="historyBack" class="history-back-btn hidden">◀ 返回</button>
            <button class="graph-tab active" id="tabExecution" data-tab="execution">诊断过程</button>
            <button class="graph-tab" id="tabHypothesis" data-tab="hypothesis">
              推理过程
              <span class="tab-badge hidden" id="hypothesisBadge">0</span>
            </button>
            <span id="historyViewerTitle" class="history-info hidden"></span>
          </div>
          <span id="graphStatus" class="graph-status idle">等待任务</span>
        </header>

        <!-- Tab: Execution Tree (existing) -->
        <div id="graphCanvas" class="graph-canvas tab-panel active" data-panel="execution">
          <svg id="graphEdges" class="graph-edges"></svg>
          <div id="graphNodes" class="graph-nodes"></div>
          <div id="graphEmpty" class="graph-empty">
            <div class="graph-empty-icon">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="24" cy="18" r="3"/><path d="M24 25v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="24" y1="33" x2="24" y2="33" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
            </div>
            <p>发送诊断请求后<br>Agent 执行流程将在此动态展示</p>
          </div>
        </div>

        <!-- Tab: Hypothesis Tree (new) -->
        <div id="hypothesisCanvas" class="graph-canvas tab-panel" data-panel="hypothesis">
          <svg id="hypothesisEdges" class="graph-edges"></svg>
          <div id="hypothesisEmpty" class="graph-empty">
            <div class="graph-empty-icon">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><path d="M24 6v36M6 24h36" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="24" cy="24" r="6" stroke="currentColor" stroke-width="2"/></svg>
            </div>
            <p>诊断开始后<br>推理过程将在此动态展示</p>
          </div>
          <div id="hypothesisTree" class="hypothesis-tree"></div>
        </div>

        <div id="toolPopup" class="tool-popup hidden">
          <div class="tool-popup-header">
            <span id="toolPopupTitle"></span>
            <button id="toolPopupClose" class="popup-close">&times;</button>
          </div>
          <div class="tool-popup-body" id="toolPopupBody"></div>
        </div>

        <!-- History Viewer (overlays tab-panel area; tabs stay visible above) -->
        <div id="historyViewer" class="history-viewer hidden">
          <!-- Execution tab content (report + graph) -->
          <div class="history-viewer-body" id="historyViewerBody">
            <div class="history-report" id="historyReport"></div>
            <div class="history-resizer" id="historyResizer"></div>
            <div class="history-graph" id="historyGraph">
              <svg class="graph-edges" id="historyEdges"></svg>
              <div class="graph-nodes" id="historyNodes"></div>
            </div>
          </div>
          <!-- Hypothesis tab content (reasoning tree) -->
          <div class="history-hypothesis-canvas" id="historyHypothesisCanvas">
            <svg class="graph-edges" id="historyHypothesisEdges"></svg>
            <div id="historyHypothesisEmpty" class="graph-empty">
              <div class="graph-empty-icon">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><path d="M24 6v36M6 24h36" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="24" cy="24" r="6" stroke="currentColor" stroke-width="2"/></svg>
              </div>
              <p>该报告无推理过程数据</p>
            </div>
            <div id="historyHypothesisTree" class="hypothesis-tree"></div>
          </div>
        </div>
      </aside>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
